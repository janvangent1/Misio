<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 22 16" aria-hidden="true">
        <rect x="0.75" y="3.25" width="10.5" height="7.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M11.5 7h6.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M15.4 4.4 18.9 7 15.4 9.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Misio</h1>
        <p data-ui="tagline">Minimalistic version of Visio</p>
      </div>
    </div>
    <div class="tools" role="toolbar" data-ui-label="tools" aria-label="Tools">
      <button id="tool-select" type="button" aria-pressed="true" data-ui="select" data-ui-title="select-title" title="Select (V)">Select</button>
      <button id="tool-connect" type="button" aria-pressed="false" data-ui="connector" data-ui-title="connector-title" title="Connector (C)">Connector</button>
      <select id="connector-ends" data-ui-label="ends-label" data-ui-title="ends-title" aria-label="Connector ends" title="Arrow on new connectors. With a connector selected, this changes that connector.">
        <option value="auto" data-ui="ends-auto">Automatic</option>
        <option value="none" data-ui="ends-none">No arrow</option>
        <option value="end" data-ui="ends-end">One arrow</option>
        <option value="both" data-ui="ends-both">Two arrows</option>
      </select>
      <button id="tool-bus" type="button" aria-pressed="false" data-ui="bus-tool" data-ui-title="bus-title" title="Bus (B). Drag a bar, then drop a symbol on it.">Bus</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="undo" type="button" data-ui="undo" data-ui-title="undo-title" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="redo" type="button" data-ui="redo" data-ui-title="redo-title" title="Redo (Ctrl+Y)" disabled>Redo</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="arrange" type="button" data-ui="arrange" data-ui-title="arrange-title" title="Arrange shapes and connectors (Ctrl+Shift+L)">Arrange</button>
      <button id="legend" type="button" data-ui="legend" data-ui-title="legend-title" title="Add a legend of the symbols on this page">Legend</button>
      <button id="align-left" type="button" data-ui="align-left" data-ui-title="align-title" title="Align the left edges of the selected shapes">Align left</button>
      <button id="space-even" type="button" data-ui="space" data-ui-title="space-title" title="Space the selected shapes evenly">Space</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="zoom-out" type="button" data-ui-title="zoom-out" title="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" type="button" data-ui-title="zoom-in" title="Zoom in">+</button>
      <button id="fit" type="button" data-ui="fit" data-ui-title="fit-title" title="Fit the diagram in the window">Fit</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <div class="file-actions" role="toolbar" data-ui-label="file" aria-label="File">
      <button id="new-doc" type="button" data-ui="new">New</button>
      <button id="open-doc" type="button" data-ui="open">Open</button>
      <button id="save-doc" type="button" data-ui="save">Save</button>
      <button id="export-svg" type="button" data-ui="export-svg">Export SVG</button>
      <button id="export-pdf" type="button" data-ui="export-pdf" data-ui-title="export-pdf-title" title="Open a one-page sheet and print it to PDF">Export PDF</button>
      <span class="sep" aria-hidden="true"></span>
      <select id="lang" data-ui-label="language" aria-label="Language">
        <option value="en">English</option>
        <option value="nl">Nederlands</option>
        <option value="fr">Français</option>
      </select>
      <input id="file-input" type="file" accept="application/json,.json" hidden>
    </div>
  </header>
  <div id="confirm" class="confirm" hidden>
    <span data-ui="clear-ask">Clear this diagram?</span>
    <button id="confirm-yes" type="button" data-ui="clear">Clear</button>
    <button id="confirm-no" type="button" data-ui="cancel">Cancel</button>
  </div>
  <div class="workspace">
    <aside class="stencil" data-ui-label="shapes-label" aria-label="Shapes">
      <h2 data-ui="shapes">Shapes</h2>
      <input id="shape-search" type="search" data-ui-placeholder="search-placeholder" data-ui-label="search-label" placeholder="Search shapes" aria-label="Search shapes" autocomplete="off" spellcheck="false">
      <div id="masters"></div>
      <p class="hint" data-ui="hint">Drag a shape onto the page. Shift-click selects several. Ctrl+C, Ctrl+V, and Ctrl+D copy them. Drop a symbol on a bus to add a tap. Double-click to edit text.</p>
    </aside>
    <div id="canvas-wrap" class="canvas-wrap">
      <svg id="canvas" data-ui-label="canvas" aria-label="Diagram canvas"></svg>
      <textarea id="text-editor" rows="2" hidden spellcheck="false" data-ui-label="diagram-text" aria-label="Diagram text"></textarea>
    </div>
  </div>
  <script src="lang.js"></script>
  <script src="arei.js"></script>
  <script src="network.js"></script>
  <script src="schematic.js"></script>
  <script src="app.js"></script>
</body>
</html>
