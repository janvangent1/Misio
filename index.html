<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="bar-main">
      <div class="brand">
        <svg class="mark" viewBox="0 0 22 16" aria-hidden="true">
          <rect x="0.75" y="3.25" width="10.5" height="7.5" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M11.5 7h6.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M15.4 4.4 18.9 7 15.4 9.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <h1>Misio</h1>
          <p data-ui="tagline">A small flowchart editor</p>
        </div>
      </div>
      <p id="status" class="status" role="status"></p>
      <div class="file-actions" role="toolbar" data-ui-label="file" aria-label="File">
        <button id="new-doc" type="button" data-ui="new">New</button>
        <button id="open-doc" type="button" data-ui="open">Open</button>
        <button id="save-doc" type="button" data-ui="save">Save</button>
        <button id="import-visio" type="button" data-ui="import-visio" data-ui-title="import-visio-title" title="Import a Visio drawing (.vsdx)">Import Visio</button>
        <button id="export-visio" type="button" data-ui="export-visio" data-ui-title="export-visio-title" title="Export a Visio drawing (.vsdx)">Export Visio</button>
        <button id="export-svg" type="button" data-ui="export-svg">Export SVG</button>
        <button id="export-pdf" type="button" data-ui="export-pdf" data-ui-title="export-pdf-title" title="Open a one-page sheet and print it to PDF">Export PDF</button>
        <button id="report" type="button" data-ui="report" data-ui-title="report-title" title="Send a bug or a request">Report</button>
        <span class="sep" aria-hidden="true"></span>
        <select id="lang" data-ui-label="language" aria-label="Language">
          <option value="en">English</option>
          <option value="nl">Nederlands</option>
          <option value="fr">Français</option>
        </select>
        <input id="file-input" type="file" accept="application/json,.json" hidden>
        <input id="visio-input" type="file" accept=".vsdx,application/vnd.ms-visio.drawing" hidden>
      </div>
    </div>
    <div class="tools" role="toolbar" data-ui-label="tools" aria-label="Tools">
      <button id="tool-select" type="button" aria-pressed="true" data-ui="select" data-ui-title="select-title" title="Select (V)">Select</button>
      <button id="tool-connect" type="button" aria-pressed="false" data-ui="connector" data-ui-title="connector-title" title="Connector (C)">Connector</button>
      <select id="connector-ends" data-ui-label="ends-label" data-ui-title="ends-title" aria-label="Connector ends" title="Arrow on new connectors. With a connector selected, this changes that connector.">
        <option value="auto" data-ui="ends-auto">Automatic</option>
        <option value="none" data-ui="ends-none">No arrow</option>
        <option value="end" data-ui="ends-end">One arrow</option>
        <option value="both" data-ui="ends-both">Two arrows</option>
      </select>
      <div id="connector-color-wrap" class="lane-color" hidden>
        <span data-ui="connector-color">Color</span>
        <button type="button" class="connector-swatch" data-color="" data-ui-title="connector-color-default" title="Default (black)" style="background:#1c1915"></button>
        <button type="button" class="connector-swatch" data-color="#184e86" data-ui-title="connector-color-blue" title="Blue" style="background:#184e86"></button>
        <button type="button" class="connector-swatch" data-color="#7dbe8a" data-ui-title="lane-color-green" title="Green" style="background:#7dbe8a"></button>
        <button type="button" class="connector-swatch" data-color="#e2b15a" data-ui-title="lane-color-amber" title="Amber" style="background:#e2b15a"></button>
        <button type="button" class="connector-swatch" data-color="#e08b8b" data-ui-title="lane-color-rose" title="Rose" style="background:#e08b8b"></button>
        <button type="button" class="connector-swatch" data-color="#a894d4" data-ui-title="lane-color-violet" title="Violet" style="background:#a894d4"></button>
        <input id="connector-color" type="color" value="#1c1915" data-ui-label="connector-color-custom" data-ui-title="connector-color-custom" aria-label="Custom connector color" title="Custom connector color">
      </div>
      <button id="tool-bus" type="button" aria-pressed="false" data-ui="bus-tool" data-ui-title="bus-title" title="Bus (B). Drag a bar, then drop a symbol on it.">Bus</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="undo" type="button" data-ui="undo" data-ui-title="undo-title" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="redo" type="button" data-ui="redo" data-ui-title="redo-title" title="Redo (Ctrl+Y)" disabled>Redo</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="arrange" type="button" data-ui="arrange" data-ui-title="arrange-title" title="Arrange shapes and connectors (Ctrl+Shift+L)">Arrange</button>
      <button id="lane" type="button" data-ui="lane" data-ui-title="lane-title" title="Add a swimlane (L). Click again for the next row. Shift-click adds a column.">Swimlane</button>
      <div id="lane-color-wrap" class="lane-color" hidden>
        <span data-ui="lane-color">Color</span>
        <button type="button" class="lane-swatch" data-color="" data-ui-title="lane-color-default" title="Default lane color" style="background:#e6eef6"></button>
        <button type="button" class="lane-swatch" data-color="#7eafd6" data-ui-title="lane-color-blue" title="Blue" style="background:#7eafd6"></button>
        <button type="button" class="lane-swatch" data-color="#7dbe8a" data-ui-title="lane-color-green" title="Green" style="background:#7dbe8a"></button>
        <button type="button" class="lane-swatch" data-color="#e2b15a" data-ui-title="lane-color-amber" title="Amber" style="background:#e2b15a"></button>
        <button type="button" class="lane-swatch" data-color="#e08b8b" data-ui-title="lane-color-rose" title="Rose" style="background:#e08b8b"></button>
        <button type="button" class="lane-swatch" data-color="#a894d4" data-ui-title="lane-color-violet" title="Violet" style="background:#a894d4"></button>
        <input id="lane-color" type="color" value="#e6eef6" data-ui-label="lane-color-custom" data-ui-title="lane-color-custom" aria-label="Custom lane color" title="Custom lane color">
      </div>
      <button id="legend" type="button" data-ui="legend" data-ui-title="legend-title" title="Add a legend of the symbols on this page">Legend</button>
      <button id="align-left" type="button" data-ui="align-left" data-ui-title="align-title" title="Align the left edges of the selected shapes">Align left</button>
      <button id="space-even" type="button" data-ui="space" data-ui-title="space-title" title="Space the selected shapes evenly">Space</button>
      <button id="snap" type="button" aria-pressed="true" data-ui="snap" data-ui-title="snap-title" title="Snap shapes and lines to the grid">Snap</button>
      <button id="rotate" type="button" data-ui="rotate" data-ui-title="rotate-title" title="Turn the selected shapes a quarter turn (R). Shift-click turns the other way.">Rotate</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="zoom-out" type="button" data-ui-title="zoom-out" title="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" type="button" data-ui-title="zoom-in" title="Zoom in">+</button>
      <button id="fit" type="button" data-ui="fit" data-ui-title="fit-title" title="Fit the diagram in the window">Fit</button>
    </div>
  </header>
  <dialog id="report-dialog" class="report-dialog">
    <form id="report-form">
      <h2 data-ui="report">Report</h2>
      <label>
        <span data-ui="report-kind">Kind</span>
        <select id="report-kind">
          <option value="bug" data-ui="report-bug">Bug</option>
          <option value="request" data-ui="report-request">Request</option>
        </select>
      </label>
      <label>
        <span data-ui="report-name">Name</span>
        <input id="report-name" type="text" maxlength="80" data-ui-placeholder="report-name-placeholder" placeholder="Optional" autocomplete="name">
      </label>
      <label>
        <span data-ui="report-message">What should we know?</span>
        <textarea id="report-text" required maxlength="4000"></textarea>
      </label>
      <p id="report-note" class="report-note" role="status"></p>
      <div class="report-actions">
        <button id="report-cancel" type="button" data-ui="cancel">Cancel</button>
        <button type="submit" data-ui="report-send">Send</button>
      </div>
    </form>
  </dialog>
  <div id="confirm" class="confirm" hidden>
    <span data-ui="clear-ask">Clear this diagram?</span>
    <button id="confirm-yes" type="button" data-ui="clear">Clear</button>
    <button id="confirm-no" type="button" data-ui="cancel">Cancel</button>
  </div>
  <div class="workspace">
    <aside class="stencil" data-ui-label="shapes-label" aria-label="Shapes">
      <h2 data-ui="shapes">Shapes</h2>
      <input id="shape-search" type="search" data-ui-placeholder="search-placeholder" data-ui-label="search-label" placeholder="Search shapes" aria-label="Search shapes" autocomplete="off" spellcheck="false">
      <div id="masters"></div>
      <p class="hint" data-ui="hint">Drag a shape onto the page. Ctrl-click or Shift-click selects several, and dragging one moves them together. Ctrl+C, Ctrl+V, and Ctrl+D copy them. Drop a symbol on a bus to add a tap. Double-click to edit text.</p>
    </aside>
    <div id="canvas-wrap" class="canvas-wrap">
      <svg id="canvas" data-ui-label="canvas" aria-label="Diagram canvas"></svg>
      <textarea id="text-editor" rows="2" hidden spellcheck="false" data-ui-label="diagram-text" aria-label="Diagram text"></textarea>
    </div>
  </div>
  <script src="lang.js"></script>
  <script src="arei.js"></script>
  <script src="network.js"></script>
  <script src="schematic.js"></script>
  <script src="visio.js"></script>
  <script src="app.js"></script>
</body>
</html>
